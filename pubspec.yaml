name: bonflow_app
description: BonFlow waiter app for taking orders on the floor.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any # version pinned by flutter_localizations
  # Flutter 3.50 moved Material/Cupertino out of the SDK. `any` is resolved to the latest
  # release by pub; run `flutter pub upgrade --major-versions` to pin a caret range.
  material_ui: any
  cupertino_ui: any
  flutter_riverpod: ^2.6.1
  go_router: ^18.1.4
  dio: ^5.9.0
  flutter_secure_storage: ^11.2.0 # tokens
  shared_preferences: ^2.5.3 # master data cache + ETag

  # Generated API client (see tool/generate_api.sh). Uncomment after generating it:
  # bonflow_api:
  #   path: packages/bonflow_api

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true # localizations, see l10n.yaml
